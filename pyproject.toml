[project]
name = "solidgit-lan"
version = "0.2.0"
description = "LAN-only version control and file locking for SolidWorks assemblies"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Huseyin Celil Ek" }]
dependencies = [
    "zstandard>=0.22.0",
]

[project.optional-dependencies]
# Split so `core` stays installable (and testable) on its own.
net = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
    "zeroconf>=0.132.0",
    "cryptography>=43.0.0",
]
ui = ["PySide6>=6.8.0"]
dev = ["pytest>=8.0.0", "ruff>=0.6.0", "matplotlib>=3.8", "Pillow>=10.0"]
package = ["pyinstaller>=6.10.0"]

[project.scripts]
solidgit-lan = "solidgit_lan.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["solidgit_lan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Real defects (F, E9, B) and modern syntax (UP). The SIM rules that only suggest a
# different spelling of the same thing are left out on purpose.
select = ["F", "E9", "B", "UP"]
ignore = [
    "UP042",  # (str, Enum) is used deliberately: .value is what goes over the wire
]
